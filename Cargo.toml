[package]
name = "thodtorrent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
librqbit = { version = "=9.1.0", features = ["disable-upload"] }
winreg = "0.55"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["ico"] }
sha1 = "0.10"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
